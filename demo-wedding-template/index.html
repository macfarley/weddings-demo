<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="hero">
        <div class="hero-content">
            <h1 class="couple-names">[Couple's Names]</h1>
            <p class="wedding-date">[Wedding Date]</p>
        </div>
    </header>
    <main>
        <section class="event-details">
            <h2>Event Details</h2>
            <p>Ceremony: [Time & Location]</p>
            <p>Reception: [Time & Location]</p>
            <p>Dress Code: [Dress Code]</p>
        </section>
        <section class="gallery">
            <h2>Gallery</h2>
            <div class="gallery-grid">
                <img src="photos/happycouple.jpg" alt="Happy Couple">
                <img src="photos/pexels-eugenia-remark-5767088-15283479.jpg" alt="Floral Arch">
                <img src="photos/pexels-mahmutyilmaz-34793912.jpg" alt="Wedding Reception">
                <img src="photos/pexels-rockhillmarketing-410398.jpg" alt="Wedding Cake">
                <img src="photos/pexels-tahaasamett-28531241.jpg" alt="Wedding Venue">
            </div>
        </section>
        <section class="cta">
            <h2>Share Your Moments</h2>
            <button disabled>Upload Photos</button>
        </section>
        <section class="keepsake">
            <h2>Keepsake</h2>
            <p>[Keepsake explanation]</p>
        </section>
    </main>
    <footer>
        <div class="palette-selector">
            <label for="palette">Choose a Palette:</label>
            <select id="palette">
                <option value="garden-romance">Garden Romance</option>
                <option value="floral-blush">Floral Blush</option>
                <option value="summer-gold">Summer Gold</option>
                <option value="dusty-blue">Dusty Blue</option>
                <option value="modern-minimalist">Modern Minimalist</option>
            </select>
        </div>
    </footer>
</body>
</html>
